<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SAW 仕様書</title><link rel="icon" href="../assets/favicon.svg" type="image/svg+xml"><style>
:root{color-scheme:dark;font-family:system-ui,"Yu Gothic",sans-serif}*{box-sizing:border-box}body{margin:0;background:#172019;color:#d8ddce;font-size:14px;line-height:1.9}header{padding:22px 30px;border-bottom:1px solid #45503e;display:flex;justify-content:space-between}a{color:#cfc18d;text-underline-offset:4px}.layout{display:grid;grid-template-columns:220px minmax(0,850px);max-width:1160px;margin:auto;gap:35px;padding:30px}nav{display:flex;flex-direction:column;gap:10px;align-items:start;position:sticky;top:20px;height:fit-content;font-size:13px}nav a[aria-current=page]{color:#fff}article{min-width:0;overflow-wrap:anywhere}h1{font-size:28px;margin-top:0;font-weight:500}h2{font-size:19px;margin:30px 0 12px;border-bottom:1px solid #46513e;padding-bottom:8px;font-weight:500}p{margin:0 0 18px}pre{overflow:auto;background:#101912;padding:18px;border:1px solid #35462f;border-radius:4px;font-size:12px;line-height:1.7}code{font-family:ui-monospace,monospace;color:#d9c991}li{padding-bottom:7px}img{max-width:100%}footer{font-size:11px;color:#98aa8f;margin-top:45px;border-top:1px solid #46513e;padding-top:14px}@media(max-width:750px){.layout{grid-template-columns:1fr;padding:20px;gap:20px}nav{position:static;flex-direction:row;flex-wrap:wrap;gap:8px 16px}header{padding:18px 20px}h1{font-size:23px}}
</style></head><body><header><span>SAW / 仕様書 0.1.0</span><a href="../index.html">探索へ戻る</a></header><div class="layout"><nav id="nav" aria-label="仕様一覧"></nav><article id="content" aria-live="polite">読み込み中です。</article></div><script type="module">
const files={'README.md':'仕様書の入口','SPECIFICATION.md':'全体仕様','INPUT.md':'操作・モード','EVENTS.md':'マウスイベント','ARCHITECTURE.md':'構成・保存','ASSETS.md':'素材','PORTING.md':'adv移植記録','TESTING.md':'試験','ROADMAP.md':'拡張方針'};
const requested=new URL(location.href).searchParams.get('file'),file=Object.hasOwn(files,requested)?requested:'README.md',root=new URL('.',location.href);
for(const [key,title]of Object.entries(files)){const a=document.createElement('a');a.href='?file='+key;a.textContent=title;if(key===file)a.setAttribute('aria-current','page');document.querySelector('#nav').append(a);}
function inline(el,text){const re=/`([^`]+)`|\[([^\]]+)\]\(([^)]+)\)/g;let start=0;for(const m of text.matchAll(re)){el.append(document.createTextNode(text.slice(start,m.index)));const node=document.createElement(m[1]?'code':'a');node.textContent=m[1]??m[2];if(!m[1]){const target=new URL(m[3],root);if(!['http:','https:'].includes(target.protocol)){node.href='#';}else{node.href=target.href;if(target.origin===root.origin&&target.pathname.startsWith(root.pathname)&&Object.hasOwn(files,target.pathname.slice(root.pathname.length)))node.href='?file='+target.pathname.slice(root.pathname.length);}}el.append(node);start=m.index+m[0].length;}el.append(document.createTextNode(text.slice(start)));}
const content=document.querySelector('#content');
try{const response=await fetch(new URL(file,root));if(!response.ok)throw Error('読み込みに失敗しました');const lines=(await response.text()).split('\n');content.replaceChildren();let paragraph=[],list=null,code=null;const flush=()=>{if(paragraph.length){const p=document.createElement('p');inline(p,paragraph.join(' '));content.append(p);paragraph=[];}list=null;};for(const line of lines){if(line.startsWith('```')){flush();if(code){const pre=document.createElement('pre'),c=document.createElement('code');c.textContent=code.join('\n');pre.append(c);content.append(pre);code=null;}else code=[];continue;}if(code){code.push(line);continue;}if(!line.trim()){flush();continue;}const head=line.match(/^(#{1,3}) (.+)$/),item=line.match(/^\d+\. (.+)$/);if(head){flush();const h=document.createElement('h'+head[1].length);inline(h,head[2]);content.append(h);}else if(item){if(paragraph.length)flush();if(!list){list=document.createElement('ol');content.append(list);}const li=document.createElement('li');inline(li,item[1]);list.append(li);}else paragraph.push(line);}flush();const footer=document.createElement('footer');footer.textContent='Markdown原本を直接読み込んでいます。仕様の正本はリポジトリのdocフォルダです。';content.append(footer);document.title=files[file]+' — SAW 仕様書';}catch(error){content.textContent=error.message;}
</script></body></html>
